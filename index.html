
<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Доска объявлений</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- Верхняя часть сайта -->

    <header>

        <h1>📢 Доска объявлений</h1>

        <p>
            Размещайте и находите нужные объявления
        </p>

    </header>


    <main>



        <section class="form-section">

            <h2>Добавить объявление</h2>


            <form id="adForm">


                <label for="title">
                    Название
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Например: Продаю ноутбук"
                    required
                >


                <label for="description">
                    Описание
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Напишите описание товара"
                    required
                ></textarea>


                <label for="price">
                    Цена
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="Например: 45000"
                    step="0.01"
                    required
                >


                <label for="image">
                    Изображение
                </label>

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*"
                >


                <button type="submit">
                    Опубликовать объявление
                </button>

            </form>


            <p id="message"></p>

        </section>



     

        <section class="ads-section">


            <div class="ads-header">

                <h2>
                    Все объявления
                </h2>


                <button
                    id="showAdsButton"
                    class="show-ads-button"
                    type="button"
                >
                    Посмотреть объявления
                </button>

            </div>


            <!-- Здесь появятся объявления -->

            <div
                id="adsList"
                class="hidden"
            >
            </div>


        </section>

    </main>



 

    <script src="script.js"></script>

</body>
